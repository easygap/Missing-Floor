; 품질을 바꿔도 선택한 화면 해상도 그대로 그린다.
[ScalabilitySettings]
PerfIndexValues_ResolutionQuality="100 100 100 100 100"

; 작은 실내 광원은 샘플을 줄여도 그림자 형태를 유지한다.
; 손전등은 늘 움직이는 광원이다. 엔진 기본값(1.0)이면 그림자 해상도가 절반으로 떨어져 문틀 그림자가 계단처럼 보인다.
[ShadowQuality@2]
r.Shadow.Virtual.SMRT.SamplesPerRayLocal=2
r.Shadow.Virtual.ResolutionLodBiasLocalMoving=0.0

[ShadowQuality@3]
r.Shadow.Virtual.ResolutionLodBiasLocalMoving=0.0

; High의 기존 반사 비용을 유지하면서 장면별 더 낮은 거칠기 한계도 허용한다.
; 전역 MaxRoughnessToTrace 값은 이 한계와 포스트 프로세스 설정을 덮어쓴다.
[ReflectionQuality@2]
r.Lumen.Reflections.MaxRoughnessToTraceClamp=0.25
